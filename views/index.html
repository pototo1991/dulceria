<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Dulcería de los Sueños</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    /* Animación de entrada para tarjetas */
    .fade-up {
      animation: fadeUp 0.6s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    /* Estilo de scroll personalizado */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 230, 237, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #FF7E9F;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00D2C4;
    }
  </style>
</head>
<body class="font-sans min-h-screen text-gray-800 pb-12">

  <!-- Navigation Bar -->
  <nav class="bg-white/70 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-pink-100/50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <!-- Left side: brand -->
      <a href="/" class="font-display font-bold text-lg text-dulce-cyan tracking-wide flex items-center gap-1 hover:opacity-80 transition-opacity">
        🍬 <span class="bg-gradient-to-r from-dulce-cyan to-dulce-pink bg-clip-text text-transparent">La Dulcería</span>
      </a>
      
      <!-- Right side: Auth elements & My Orders link -->
      <div id="auth-nav-container" class="flex items-center gap-4">
        <!-- Default: show login button -->
        <button id="btn-login-trigger" class="bg-white/80 hover:bg-dulce-pink hover:text-white text-gray-700 font-semibold py-1.5 px-4 rounded-full border border-pink-200/60 shadow-sm transition-all duration-300 text-sm hover:scale-105">
          Acceso Cliente / Dueño
        </button>
      </div>
    </div>
  </nav>

  <!-- Header & Logo -->
  <header class="pt-12 pb-8 text-center relative z-10">
    <div class="inline-block relative animate-float">
      <!-- Glow effect behind logo -->
      <div class="absolute inset-0 bg-white/60 blur-2xl rounded-full scale-150 -z-10"></div>
      <h1 class="font-vintage text-5xl md:text-7xl text-dulce-cyan drop-shadow-md logo-glow animate-glow-pulse">La Dulcería</h1>
      <h2 class="font-vintage text-3xl md:text-4xl text-dulce-coral mt-[-10px] md:mt-[-15px] transform -rotate-2 logo-glow">de los sueños</h2>
    </div>
  </header>

  <!-- Categorías (Bento UI) -->
  <section class="max-w-6xl mx-auto px-4 mb-12 relative z-10">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="category-filters">
      <button data-cat="todos" class="glass-card py-4 px-6 text-center font-display font-bold text-gray-700 hover:text-dulce-cyan hover:scale-105 transition-transform duration-300 ring-2 ring-transparent focus:ring-dulce-cyan active-cat">
        Todo
      </button>
      <button data-cat="helados" class="glass-card py-4 px-6 text-center font-display font-bold text-gray-700 hover:text-dulce-pink hover:scale-105 transition-transform duration-300 ring-2 ring-transparent focus:ring-dulce-pink">
        🍦 Helados
      </button>
      <button data-cat="cafes" class="glass-card py-4 px-6 text-center font-display font-bold text-gray-700 hover:text-amber-700 hover:scale-105 transition-transform duration-300 ring-2 ring-transparent focus:ring-amber-700">
        ☕ Cafés
      </button>
      <button data-cat="preparaciones" class="glass-card py-4 px-6 text-center font-display font-bold text-gray-700 hover:text-dulce-coral hover:scale-105 transition-transform duration-300 ring-2 ring-transparent focus:ring-dulce-coral">
        🍰 Preparaciones
      </button>
    </div>
  </section>

  <!-- Dynamic Grid de Productos -->
  <main class="max-w-6xl mx-auto px-4 pb-20 relative z-10">
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      <!-- Los productos se inyectarán aquí por JS -->
    </div>
  </main>

  <!-- Floating Cart Button -->
  <div class="fixed bottom-6 right-6 z-30">
    <button id="btn-cart-trigger" class="relative bg-dulce-pink hover:bg-dulce-pink/90 text-white rounded-full p-4 shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center border-2 border-white/60">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
      </svg>
      <!-- Quantity Badge -->
      <span id="cart-badge" class="absolute -top-2 -right-2 bg-dulce-cyan text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-md transform scale-0 transition-transform duration-300">0</span>
    </button>
  </div>

  <!-- Modal Carrito (Glassmorphism) -->
  <div id="cart-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity duration-300 opacity-0">
    <div class="glass-popup p-6 max-w-md w-full mx-4 relative transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col" id="cart-content">
      <button id="close-cart" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-white rounded-full p-1 shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      
      <h2 class="font-display text-2xl font-bold text-gray-800 mb-4 border-b border-pink-100 pb-2">Tu Carrito 🛒</h2>
      
      <!-- Cart Items List (Scrollable) -->
      <div id="cart-items-container" class="flex-grow overflow-y-auto space-y-3 pr-1 mb-4 min-h-[150px]">
        <!-- Inyectado por JS -->
      </div>
      
      <!-- Cart Summary & Pickup Details -->
      <div class="border-t border-pink-100 pt-4 space-y-4">
        <div class="flex justify-between items-center font-bold text-lg text-gray-800">
          <span>Total:</span>
          <span id="cart-total" class="text-dulce-coral">$0</span>
        </div>
        
        <form id="order-form" class="space-y-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha y Hora de Recogida</label>
            <input type="datetime-local" id="order-pickup-date" class="input-field" required>
          </div>
          
          <p id="order-error" class="text-red-500 text-sm text-center hidden"></p>
          <p id="order-success-msg" class="text-emerald-500 text-sm text-center font-bold hidden"></p>
          
          <button type="submit" id="btn-submit-order" class="btn-primary w-full py-2.5">
            Confirmar Pedido Anticipado
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Mis Pedidos (Glassmorphism) -->
  <div id="orders-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity duration-300 opacity-0">
    <div class="glass-popup p-6 max-w-lg w-full mx-4 relative transform scale-95 transition-transform duration-300 max-h-[85vh] flex flex-col" id="orders-content">
      <button id="close-orders" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-white rounded-full p-1 shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      
      <h2 class="font-display text-2xl font-bold text-gray-800 mb-4 border-b border-pink-100 pb-2">Mis Pedidos Anticipados 🍬</h2>
      
      <!-- Orders List (Scrollable) -->
      <div id="orders-list-container" class="flex-grow overflow-y-auto space-y-4 pr-1">
        <!-- Inyectado por JS -->
      </div>
    </div>
  </div>

  <!-- Modal Oferta del Día (Glassmorphism) -->
  <div id="oferta-modal" class="fixed inset-0 bg-white/20 backdrop-blur-xl z-50 hidden flex items-center justify-center transition-opacity duration-500 opacity-0">
    <div class="glass-popup p-8 max-w-lg w-full mx-4 relative transform scale-95 transition-transform duration-500" id="oferta-content">
      <button id="close-oferta" class="absolute top-4 right-4 text-gray-400 hover:text-dulce-coral bg-white rounded-full p-1 shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      
      <div class="text-center">
        <span class="inline-block bg-dulce-pink text-white font-bold px-4 py-1 rounded-full text-sm mb-4 animate-bounce shadow-md">¡Oferta del Día!</span>
        <img id="oferta-img" src="" alt="Oferta" class="w-48 h-48 object-cover mx-auto rounded-2xl shadow-xl mb-6 border-4 border-white">
        <h3 id="oferta-nombre" class="font-display text-3xl font-bold text-dulce-cyan mb-2"></h3>
        <p id="oferta-desc" class="text-gray-600 mb-4"></p>
        <div class="flex items-center justify-center gap-4">
          <span id="oferta-precio" class="text-2xl font-bold text-dulce-coral"></span>
          <button id="btn-oferta-add" class="btn-primary">¡Lo Quiero!</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Login / Registro (Glassmorphism) -->
  <div id="auth-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity duration-300 opacity-0">
    <div class="glass-popup p-8 max-w-sm w-full mx-4 relative transform scale-95 transition-transform duration-300" id="auth-content">
      <button id="close-auth" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-white rounded-full p-1 shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      
      <!-- Titulo -->
      <h2 id="auth-title" class="font-display text-2xl font-bold text-center text-dulce-cyan mb-6">Iniciar Sesión</h2>
      
      <form id="auth-form" class="space-y-4">
        <!-- Campo Nombre (solo para registro) -->
        <div id="field-nombre" class="hidden">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label>
          <input type="text" id="auth-nombre" class="input-field" placeholder="Juan Pérez">
        </div>
        
        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
          <input type="email" id="auth-email" class="input-field" required placeholder="correo@ejemplo.com">
        </div>
        
        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="auth-password" class="input-field" required placeholder="••••••••">
        </div>
        
        <!-- Error Msg -->
        <p id="auth-error" class="text-red-500 text-sm text-center hidden"></p>
        
        <!-- Submit Button -->
        <button type="submit" id="auth-submit-btn" class="btn-primary w-full">Ingresar</button>
      </form>
      
      <!-- Selector Login/Register -->
      <p class="text-center text-sm text-gray-600 mt-6">
        <span id="auth-switch-text">¿No tienes una cuenta?</span>
        <button id="btn-auth-switch" class="text-dulce-pink font-semibold hover:underline focus:outline-none ml-1">Regístrate</button>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
